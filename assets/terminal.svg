<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" xml:space="preserve" role="img" aria-label="Terminal: a traceroute from a home lab through Packet Tracer, GNS3 and YouTube to cisroute.com, then show interfaces.">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
      .u { fill: #7ee787; font-weight: 700; } .p { fill: #79c0ff; } .c { fill: #6e7681; } .g { fill: #ffd166; font-weight: 700; }
      .as { fill: #d2a8ff; } .ok { fill: #80ffdb; font-weight: 700; } .t { fill: #8b949e; }
      .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    </style>
    <clipPath id="type1"><rect x="20" y="52" height="26" width="0"><animate attributeName="width" from="0" to="840" begin="0.6s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="20" y="268" height="26" width="0"><animate attributeName="width" from="0" to="840" begin="6.4s" dur="1.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="880" height="400" rx="12" fill="#0d1117"/>
  <rect width="880" height="34" rx="12" fill="#161b22"/><rect y="22" width="880" height="12" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="440" y="22" text-anchor="middle" class="t" style="font-size:12px">hari@cisroute — zsh — 88×20</text>

  <!-- $ traceroute -->
  <text x="24" y="70" clip-path="url(#type1)"><tspan class="u">hari@cisroute</tspan>:<tspan class="p">~</tspan>$ traceroute -A cisroute.com</text>

  <text x="24" y="96" opacity="0" class="t">traceroute to cisroute.com, 30 hops max, 60 byte packets<set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/></text>
  <text x="24" y="120" opacity="0"> 1  home-lab.gw       <tspan class="as">[AS65001]</tspan>   0.42 ms   <tspan class="c"># where it started</tspan><set attributeName="opacity" to="1" begin="2.9s" fill="freeze"/></text>
  <text x="24" y="144" opacity="0"> 2  packet-tracer.lab <tspan class="as">[AS65010]</tspan>   1.08 ms   <tspan class="c"># CCNA labs</tspan><set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/></text>
  <text x="24" y="168" opacity="0"> 3  gns3.lab          <tspan class="as">[AS65020]</tspan>   2.31 ms   <tspan class="c"># breaking OSPF on purpose</tspan><set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/></text>
  <text x="24" y="192" opacity="0"> 4  youtube/@cisroute <tspan class="as">[AS65030]</tspan>   3.77 ms   <tspan class="c"># explaining what I learn</tspan><set attributeName="opacity" to="1" begin="4.7s" fill="freeze"/></text>
  <text x="24" y="216" opacity="0"> 5  <tspan class="g">cisroute.com      [AS65000]</tspan>   4.02 ms   <tspan class="c"># come say hi</tspan><set attributeName="opacity" to="1" begin="5.4s" fill="freeze"/></text>

  <!-- $ show ip bgp -->
  <text x="24" y="286" clip-path="url(#type2)"><tspan class="u">hari@cisroute</tspan>:<tspan class="p">~</tspan>$ show interfaces Passion0/0 | include line|errors</text>
  <text x="24" y="312" opacity="0">  Passion0/0 is <tspan class="ok">up</tspan>, line protocol is <tspan class="ok">up</tspan><set attributeName="opacity" to="1" begin="8.5s" fill="freeze"/></text>
  <text x="24" y="336" opacity="0">  <tspan class="g">1337</tspan> input errors   <tspan class="c"># that's how I learn</tspan><set attributeName="opacity" to="1" begin="9.1s" fill="freeze"/></text>

  <text x="24" y="372" opacity="0"><tspan class="u">hari@cisroute</tspan>:<tspan class="p">~</tspan>$ <tspan class="cur">█</tspan><set attributeName="opacity" to="1" begin="9.7s" fill="freeze"/></text>
</svg>
