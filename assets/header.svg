<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Hi, I'm Hariharan Ravi. Infrastructure engineer, mostly into networks. www.cisroute.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#14233a" stroke-width="1"/>
    </pattern>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#80ffdb"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#80ffdb" stop-opacity="1"/>
      <stop offset="1" stop-color="#80ffdb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldglow">
      <stop offset="0" stop-color="#ffd166" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <!-- Classic Cisco-style router: a cylinder with arrows on top -->
    <symbol id="router" viewBox="-26 -20 52 40">
      <path d="M-22,-6 v12 a22,8 0 0 0 44,0 v-12" fill="#0f2238" stroke="#4cc9f0" stroke-width="2"/>
      <ellipse cx="0" cy="-6" rx="22" ry="8" fill="#17385a" stroke="#4cc9f0" stroke-width="2"/>
      <path d="M-14,-6 h9 M-8,-8.5 l3,2.5 l-3,2.5 M14,-6 h-9 M8,-8.5 l-3,2.5 l3,2.5" fill="none" stroke="#e0fbfc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="switch" viewBox="-26 -16 52 32">
      <rect x="-22" y="-11" width="44" height="22" rx="3" fill="#0f2238" stroke="#4cc9f0" stroke-width="2"/>
      <path d="M-14,-4 h22 M4,-7 l4,3 l-4,3 M14,4 h-22 M-4,1 l-4,3 l4,3" fill="none" stroke="#e0fbfc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Routes the packets take to the destination node -->
    <path id="r1" d="M590,80 L720,50 L860,85 L900,235"/>
    <path id="r2" d="M620,220 L770,175 L900,235"/>
    <path id="r3" d="M720,50 L770,175 L900,235"/>
    <path id="r4" d="M590,80 L620,220 L770,175 L860,85 L900,235"/>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace; }
      .sans { font-family: 'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
      .wave { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.4s ease-in-out infinite; }
      @keyframes wave { 0%,60%,100% {transform: rotate(0)} 10% {transform: rotate(16deg)} 20% {transform: rotate(-8deg)} 30% {transform: rotate(16deg)} 40% {transform: rotate(-4deg)} 50% {transform: rotate(10deg)} }
      .fade { opacity: 0; animation: fadeUp .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .4s } .d3 { animation-delay: .7s } .d4 { animation-delay: 1s } .d5 { animation-delay: 1.3s }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
      .link { stroke: #1f4b6e; stroke-width: 2; }
      .flow { stroke: #4cc9f0; stroke-width: 2; stroke-dasharray: 4 10; animation: flow 1.2s linear infinite; opacity: .55; }
      @keyframes flow { to { stroke-dashoffset: -28 } }
      .lbl { fill: #7d93ad; font-size: 11px; }
      .blink { animation: blink 1.6s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="16" fill="url(#grid)" opacity=".7"/>

  <!-- ===== Left: hello ===== -->
  <text x="44" y="42" class="mono fade d1" font-size="13" fill="#4cc9f0">🌐 www.cisroute.com</text>
  <g class="fade d1">
    <text x="44" y="82" font-size="30" class="wave">👋</text>
    <text x="84" y="80" class="sans" font-size="22" fill="#9fb3c8">Hi there, I'm</text>
  </g>
  <text x="42" y="140" class="sans fade d2" font-size="54" font-weight="800" fill="url(#title)">Hariharan Ravi</text>
  <text x="44" y="180" class="sans fade d3" font-size="19" fill="#e0e6ee">Infrastructure engineer, mostly into <tspan fill="#80ffdb" font-weight="700">networks</tspan>.</text>
  <text x="44" y="208" class="mono fade d3" font-size="14" fill="#7d93ad">Routing · Switching · BGP · OSPF · Subnetting</text>

  <g class="fade d4">
    <rect x="44" y="234" width="214" height="34" rx="17" fill="#ff0033"/>
    <path d="M62,243 l12,8 l-12,8z" fill="#fff"/>
    <text x="84" y="256" class="sans" font-size="15" font-weight="700" fill="#fff">Cisroute on YouTube</text>
  </g>
  <g class="fade d5">
    <rect x="270" y="234" width="196" height="34" rx="17" fill="none" stroke="#ffd166" stroke-width="1.5"/>
    <text x="368" y="256" class="mono" font-size="13" fill="#ffd166" text-anchor="middle">studying CCNP SPCOR</text>
  </g>

  <!-- ===== Right: live topology ===== -->
  <g>
    <line class="link" x1="590" y1="80" x2="720" y2="50"/>
    <line class="link" x1="720" y1="50" x2="860" y2="85"/>
    <line class="link" x1="590" y1="80" x2="620" y2="220"/>
    <line class="link" x1="620" y1="220" x2="770" y2="175"/>
    <line class="link" x1="720" y1="50" x2="770" y2="175"/>
    <line class="link" x1="770" y1="175" x2="860" y2="85"/>
    <line class="link" x1="860" y1="85" x2="900" y2="235"/>
    <line class="link" x1="770" y1="175" x2="900" y2="235"/>
    <use href="#r1" class="flow" fill="none"/>
    <use href="#r2" class="flow" fill="none" style="animation-duration:1.6s"/>
  </g>

  <!-- Destination: pulsing beacon -->
  <circle cx="900" cy="235" r="60" fill="url(#goldglow)"/>
  <circle cx="900" cy="235" r="22" fill="none" stroke="#ffd166" stroke-width="2">
    <animate attributeName="r" values="22;58" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="235" r="22" fill="none" stroke="#ffd166" stroke-width="2">
    <animate attributeName="r" values="22;58" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="235" r="24" fill="#2a2108" stroke="#ffd166" stroke-width="2.5"/>
  <text x="900" y="240" class="mono" font-size="13" font-weight="800" fill="#ffd166" text-anchor="middle">www</text>
  <text x="900" y="282" class="sans" font-size="12" font-weight="700" fill="#ffd166" text-anchor="middle">CISROUTE</text>
  <text x="900" y="297" class="mono" font-size="9" fill="#b39248" text-anchor="middle" letter-spacing="2">.COM</text>

  <!-- Devices -->
  <use href="#router" x="564" y="60" width="52" height="40"/>
  <use href="#router" x="694" y="30" width="52" height="40"/>
  <use href="#router" x="834" y="65" width="52" height="40"/>
  <use href="#switch" x="594" y="204" width="52" height="32"/>
  <use href="#router" x="744" y="155" width="52" height="40"/>

  <text x="590" y="116" class="mono lbl" text-anchor="middle">curiosity</text>
  <text x="720" y="22" class="mono lbl" text-anchor="middle">CCNA labs</text>
  <text x="860" y="121" class="mono lbl" text-anchor="middle">GNS3 / BGP</text>
  <text x="620" y="252" class="mono lbl" text-anchor="middle">VLANs</text>
  <text x="770" y="211" class="mono lbl" text-anchor="middle">Cisroute</text>

  <!-- Packets in flight -->
  <g>
    <circle r="9" fill="url(#glow)"/><rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#80ffdb"/>
    <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#r1"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="url(#glow)"/><rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#4cc9f0"/>
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" rotate="auto"><mpath href="#r2"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="url(#glow)"/><rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#f72585"/>
    <animateMotion dur="2.8s" begin="1.1s" repeatCount="indefinite" rotate="auto"><mpath href="#r3"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="url(#glow)"/><rect x="-5" y="-3.5" width="10" height="7" rx="1.5" fill="#ffd166"/>
    <animateMotion dur="4.6s" begin="0.3s" repeatCount="indefinite" rotate="auto"><mpath href="#r4"/></animateMotion>
  </g>

  <!-- Footer status line -->
  <text x="44" y="302" class="mono" font-size="11" fill="#4a6585">R1# show ip ospf neighbor  ·  FULL/DR  ·  Gi0/0 is <tspan fill="#80ffdb">up/up</tspan><tspan class="blink" fill="#80ffdb"> █</tspan></text>
</svg>
