name: Latest Cisroute videos

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: YOUTUBE
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCuTSM4mcn4m2hiqB35aweew"
          max_post_count: 4
          template: '- ▶️ [$title]($url)$newline'
          commit_message: "chore: refresh latest Cisroute videos"
